server {
    listen 80;
    server_name skate.arkanatech.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name skate.arkanatech.tech;

    ssl_certificate     /etc/letsencrypt/live/skate.arkanatech.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skate.arkanatech.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

server {
    listen 443 ssl http2;
    server_name api.skate.arkanatech.tech;

    ssl_certificate     /etc/letsencrypt/live/api.skate.arkanatech.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.skate.arkanatech.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
